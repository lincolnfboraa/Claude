# Bora Studio no nginx que já existe no VPS (não altera o CRM). O certbot acrescenta o HTTPS.
server {
    listen 80;
    server_name studio.borasolucoesdigitais.com;
    root /opt/bora/repo/bora_estudio/app;
    index index.html;
    location = /config.js { alias /opt/bora/config.js; add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name editor.borasolucoesdigitais.com;
    client_max_body_size 64m;              # o app envia o vídeo em partes de 8 MB
    proxy_request_buffering off;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
