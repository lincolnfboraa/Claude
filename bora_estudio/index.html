<title>Bora Estúdio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@600;700&display=swap">
<style>
/* Layout: app iOS-like num frame de celular. Pilha de navegação (push), barras translúcidas, listas agrupadas, sheets de baixo pra cima */
:root{
  --bg:#06182C; --bg2:#0A2340; --glass:rgba(16,42,72,.62); --cell:rgba(255,255,255,.055); --sep:rgba(255,255,255,.08);
  --orange:#FF6115; --cream:#F3EEE6; --txt:#F3F6FA; --sub:rgba(235,240,247,.58); --ok:#34C77B; --warn:#FFB340;
  --ui:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif; --brand:'Lexend',var(--ui);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#030E1B;color:var(--txt);font-family:var(--ui);display:flex;justify-content:center;align-items:flex-start;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.phone{position:relative;width:100%;max-width:400px;height:820px;max-height:calc(100vh - 40px);min-height:640px;border-radius:44px;overflow:hidden;
  background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5)}
.glow{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(260px 220px at 90% -4%,rgba(255,97,21,.30),transparent 70%),
  radial-gradient(300px 260px at -10% 40%,rgba(48,110,180,.35),transparent 70%)}
.view{position:absolute;inset:0;overflow-y:auto;padding:0 16px 120px;transition:transform .35s cubic-bezier(.3,.8,.2,1),opacity .35s;background:transparent}
.view.out{transform:translateX(-28%);opacity:0;pointer-events:none}.view.in{transform:translateX(100%)}
.nav{position:sticky;top:0;z-index:5;margin:0 -16px;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;min-height:54px;
  background:linear-gradient(var(--bg) 0,rgba(6,24,44,.75) 100%);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.nav .t{font-weight:600;font-size:16px;opacity:0;transition:opacity .2s}.nav.solid .t{opacity:1}
.back{color:var(--orange);font-size:16px;display:flex;align-items:center;gap:2px}
.round{width:34px;height:34px;border-radius:50%;background:var(--cell);display:grid;place-items:center}
.round svg,.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 18px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--brand);font-weight:700;color:var(--orange);font-size:19px}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:24px 4px 8px;display:flex;justify-content:space-between}
h3 button{color:var(--orange);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
.group{background:var(--cell);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--sep)}
.row.plain+.row.plain::before{left:14px}
.row .tx{flex:1;min-width:0}.row b{display:block;font-weight:500;font-size:15px}.row small{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:rgba(255,255,255,.3);font-size:18px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;background:#1C3E66}
.av.f{background:linear-gradient(140deg,#C8B9A7,#8FB0D8);color:#0F1C4A}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--orange);color:#fff}
.cta{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;text-align:left;background:linear-gradient(135deg,#FF6115,#FF8A3D);color:#fff;box-shadow:0 10px 30px rgba(255,97,21,.3)}
.cta .p{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.cta b{display:block;font-size:17px}.cta small{opacity:.85;font-size:13px}
.reels{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.reel{flex:0 0 128px;scroll-snap-align:start;text-align:left}
.cover{aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(170deg,#4A6A8E,#1B3350 60%,#0C1B2E)}
.cover.c2{background:linear-gradient(170deg,#7A5B4B,#3B2A24 60%,#160E0B)}
.cover .tt{position:absolute;left:8px;right:8px;top:44%;text-align:center;font-size:7px;letter-spacing:.3em;color:#8FB0D8}
.cover .tt i{display:block;font:italic 900 19px Georgia,serif;letter-spacing:.04em;margin:2px 0}
.cover .tt span{color:#fff;font-size:8px;letter-spacing:0;font-weight:600}
.cover .st{position:absolute;top:8px;left:8px}
.pillst{font-size:11px;font-weight:600;padding:4px 8px;border-radius:99px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(0,0,0,.35)}
.pillst.ok{color:var(--ok)}.pillst.wait{color:var(--warn)}.pillst.run{color:#fff}
.reel b{display:block;font-size:13px;font-weight:500;margin-top:7px;line-height:1.3}.reel small{color:var(--sub);font-size:12px}
.ring{width:38px;height:38px;flex:none}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;height:64px;border-radius:32px;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;
  background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.35)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub)}
.tabbar button.on{color:var(--orange)}
.tabbar .plus{width:48px;height:48px;border-radius:50%;background:var(--orange);color:#fff;justify-self:center;display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,97,21,.45)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cell);border-radius:10px;padding:2px;margin:16px 0 4px}
.seg button{padding:7px;border-radius:8px;font-size:13px;font-weight:500;color:var(--sub)}.seg button.on{background:rgba(255,255,255,.14);color:var(--txt)}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:4px}
.head .av{width:76px;height:76px;font-size:26px}
.head h1{font-size:24px;margin:4px 0 0}.head p{margin:0;color:var(--sub);font-size:14px}
.stats{display:flex;justify-content:center;gap:22px;margin-top:8px;font-size:13px;color:var(--sub)}.stats b{color:var(--txt);font-size:16px;display:block}
.cap{display:flex;gap:8px;margin-top:14px;width:100%}
.capbtn{flex:1;padding:11px;border-radius:99px;background:var(--cell);font-weight:600;font-size:14px}.capbtn.pri{background:var(--orange);color:#fff}
.vid{width:66%;margin:6px auto 0}
.vid .cover{border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.play{position:absolute;inset:auto 0 12px;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center}
.leg{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:9px;text-shadow:0 1px 3px #000}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 0}
.tag{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--cell);color:var(--sub)}
.tl .row{align-items:flex-start}.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);margin:5px 14px 0 4px;flex:none}
.tl .row+.row::before{left:28px}
.dock{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;display:flex;gap:8px;padding:8px;border-radius:32px;background:var(--glass);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.dock .capbtn{padding:13px}
.dim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;border-radius:28px 28px 0 0;padding:8px 16px 28px;max-height:88%;overflow-y:auto;
  background:rgba(14,38,66,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transform:translateY(105%);transition:transform .38s cubic-bezier(.3,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.sh b{font-size:17px}.sh button{color:var(--orange);font-size:16px}
.drop{border:1.5px dashed rgba(255,255,255,.2);border-radius:18px;padding:22px;text-align:center;color:var(--sub);font-size:14px;display:block;cursor:pointer}
.drop b{display:block;color:var(--txt);font-size:15px;margin:6px 0 2px}
.check{color:var(--orange);font-weight:700}
textarea{width:100%;min-height:96px;border:0;border-radius:14px;background:var(--cell);color:var(--txt);padding:12px 14px;font:inherit;font-size:15px;resize:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px;padding:0 16px}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:99px;background:var(--cell)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--ok);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.off{background:rgba(255,255,255,.16)}.sw.off::after{left:2px}
.toast{position:absolute;top:14px;left:50%;z-index:40;transform:translate(-50%,-80px);transition:transform .35s;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;
  background:rgba(30,60,96,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.toast.on{transform:translate(-50%,0)}
.sw-col{display:inline-block;width:22px;height:22px;border-radius:50%;margin-left:-6px;border:2px solid var(--bg)}
.empty{color:var(--sub);font-size:14px;padding:14px}
@media (prefers-reduced-motion:reduce){.view,.sheet,.toast,.dim{transition:none}}
</style>

<div class="phone" id="ph">
  <div class="glow"></div>
  <div id="stack"></div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação">
    <button data-tab="inicio" class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-tab="clientes"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg>Clientes</button>
    <button class="plus" data-sheet="nova" aria-label="Nova edição"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="validar"><svg class="ico" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M10.5 9.5l4 2.5-4 2.5z"/></svg>Validar</button>
    <button data-tab="dna"><svg class="ico" viewBox="0 0 24 24"><path d="M7 3c0 6 10 6 10 12s-10 0-10 6M17 3c0 6-10 6-10 12M9 6h6M9 18h6"/></svg>DNA</button>
  </nav>
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
const ic={chev:'<span class="chev">›</span>'};
const DB={
 clientes:[
  {id:'fabiola',nome:'Dra. Fabiola Pedron',area:'Nefrologia · Reels educativos',ini:'FP',cls:'f',cores:['#C8B9A7','#8FB0D8','#0F1C4A'],
   dna:[['Imagem','HDR original, sem filtro'],['Legenda','Branca, minúscula, sem ponto'],['Título','Rótulo, tema em serifa, pergunta'],['Destaques','3 a 4, estilos variados'],['Palavra solta','2 a 3 por vídeo'],['Ritmo','Pausas cortadas, fala natural'],['Música e SFX','Bora, no CapCut']],
   regras:['Gancho direto na pergunta, sem "agora eu vou falar"','B-roll animado é vídeo de verdade, não imagem deslizando','Branco da legenda forte, nada acinzentado','Nunca cortar final de palavra']},
  {id:'vida',nome:'Clínica Vida',area:'Odontologia · Stories',ini:'CV',cls:'',cores:['#2E7D6B','#F3EEE6'],dna:[['Imagem','Original, sem filtro'],['Legenda','Aprendendo']],regras:[]},
  {id:'casa',nome:'Casa Moura Arquitetura',area:'Arquitetura · Reels',ini:'CM',cls:'',cores:['#B9875A','#1E1E1E'],dna:[['Imagem','Original, sem filtro']],regras:[]}],
 videos:[
  {id:'prostata',cli:'fabiola',t:'Novembro Azul',tema:'Próstata',sub:'pode prejudicar seus rins?',dur:'91 s',st:'wait',v:2,
   hist:[['v1','Primeira versão',"Gancho começando em \"o que esse canudinho\""],['v2','Seu ajuste','Subtítulo "pode prejudicar seus rins?" e linhas alinhadas']]},
  {id:'diabetes',cli:'fabiola',t:'Dia mundial do diabetes',tema:'Diabetes',sub:'e o seu rim?',dur:'101 s',st:'ok',v:4,hist:[['v4','Aprovado pela cliente','Entregue em 4K']]},
  {id:'energ',cli:'fabiola',t:'Energéticos',tema:'Energético',sub:'faz mal pro rim?',dur:'64 s',st:'ok',v:8,c2:1,hist:[['v8','Aprovado','Entregue em 4K']]},
  {id:'implante',cli:'vida',t:'Antes e depois',tema:'Implante',sub:'dói mesmo?',dur:'38 s',st:'run',v:1,c2:1,prog:.62,hist:[]}]
};
const ST={ok:['Aprovado','ok'],wait:['Pra validar','wait'],run:['Editando','run']};
const S={stack:[{v:'inicio'}],tab:'inicio',seg:'videos',dnaOn:true,novaCli:'fabiola'};
const $=s=>document.querySelector(s), cli=id=>DB.clientes.find(c=>c.id===id), vid=id=>DB.videos.find(v=>v.id===id);
const SV=(d)=>`<svg class="ico" viewBox="0 0 24 24">${d}</svg>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function cover(v,big){return `<div class="cover ${v.c2?'c2':''}"><span class="st pillst ${ST[v.st][1]}">${v.st==='run'?Math.round(v.prog*100)+'%':ST[v.st][0]}</span>
 <div class="tt">${v.t.toUpperCase()}<i>${v.tema}</i><span>${v.sub}</span></div>${big?'<div class="leg">o que esse canudinho tem a ver</div><button class="play" aria-label="Reproduzir">'+SV('<path d="M8 5l11 7-11 7z" fill="#fff" stroke="none"/>')+'</button>':''}</div>`}
function reel(v){return `<button class="reel" data-push="video:${v.id}">${cover(v)}<b>${v.tema}</b><small>${cli(v.cli).nome.replace('Dra. ','')} · v${v.v}</small></button>`}
function cliRow(c){const n=DB.videos.filter(v=>v.cli===c.id),p=n.filter(v=>v.st==='wait').length;
 return `<button class="row" data-push="cliente:${c.id}"><span class="av ${c.cls}">${c.ini}</span><span class="tx"><b>${c.nome}</b><small>${c.area}</small></span>${p?`<span class="badge">${p}</span>`:''}${ic.chev}</button>`}
function vidRow(v){return `<button class="row" data-push="video:${v.id}"><span style="width:38px;flex:none">${cover(v).replace('class="cover','class="cover" style="border-radius:8px;width:38px" data-x="')}</span><span class="tx"><b>${v.tema}: ${v.sub}</b><small>${v.dur} · v${v.v} · <span style="color:var(--${v.st==='ok'?'ok':v.st==='wait'?'warn':'txt'})">${v.st==='run'?'editando '+Math.round(v.prog*100)+'%':ST[v.st][0].toLowerCase()}</span></small></span>${ic.chev}</button>`}

const V={
 inicio(){const w=DB.videos.filter(v=>v.st==='wait'),r=DB.videos.filter(v=>v.st==='run');
  return `<div class="nav"><span class="brand"><svg width="22" height="22" viewBox="0 0 100 100" fill="none" stroke="#FF6115" stroke-width="8" stroke-linecap="round"><path d="M50 16a34 34 0 1 1-34 36"/><path d="M8 38c9-20 34-30 58-19"/><path d="M92 62c-9 20-34 30-58 19"/></svg>bora</span><button class="round" aria-label="Notificações">${SV('<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/>')}</button></div>
  <div class="big">Estúdio</div><p class="lead">${w.length?`${w.length} vídeo esperando seu ok`:'Tudo validado por aqui'}</p>
  <button class="cta" data-sheet="nova"><span class="p">${SV('<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>')}</span><span><b>Nova edição</b><small>Sobe o bruto, volta a prévia em 480p</small></span></button>
  ${w.length||r.length?`<h3>Na sua mesa</h3><div class="reels">${[...w,...r].map(reel).join('')}</div>`:''}
  <h3>Clientes <button data-tab="clientes">Ver todos</button></h3><div class="group">${DB.clientes.map(cliRow).join('')}</div>`},
 clientes(){return `<div class="nav"><span class="t">Clientes</span><button class="round" aria-label="Novo cliente" data-toast="Novo perfil: envie 2 ou 3 vídeos aprovados pra criar o DNA">${SV('<path d="M12 5v14M5 12h14"/>')}</button></div>
  <div class="big">Clientes</div><p class="lead">Cada cliente tem seu padrão e seus vídeos</p><div class="group">${DB.clientes.map(cliRow).join('')}</div>`},
 validar(){const w=DB.videos.filter(v=>v.st!=='ok');return `<div class="nav"><span class="t">Validar</span><span></span></div><div class="big">Validar</div><p class="lead">Prévias em 480p esperando aprovado ou ajuste</p>
  ${w.length?`<div class="group">${w.map(vidRow).join('')}</div>`:'<div class="group empty">Nada pendente</div>'}`},
 dna(){return `<div class="nav"><span class="t">DNA</span><span></span></div><div class="big">DNA de edição</div><p class="lead">O que o app aprendeu com cada cliente</p>
  <div class="group">${DB.clientes.map(c=>`<button class="row" data-push="cliente:${c.id}:dna"><span class="av ${c.cls}">${c.ini}</span><span class="tx"><b>${c.nome}</b><small>${c.dna.length+c.regras.length} regras · ${c.regras.length} aprendidas em ajustes</small></span>${ic.chev}</button>`).join('')}</div>
  <h3>Regras da casa</h3><div class="group">${['Nunca aplicar filtro ou suavização','Música e efeitos ficam com a Bora','Prévia em 480p, final em 4K'].map(x=>`<div class="row plain"><span class="tx"><b style="font-size:14px">${x}</b></span></div>`).join('')}</div>`},
 cliente(id,seg){const c=cli(id);seg=seg||S.seg;const vs=DB.videos.filter(v=>v.cli===id);
  return `<div class="nav"><button class="back" data-pop>‹ Voltar</button><span class="t">${c.nome}</span><button class="round" aria-label="Mais">${SV('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>')}</button></div>
  <div class="head"><span class="av ${c.cls}">${c.ini}</span><h1>${c.nome}</h1><p>${c.area}</p>
   <div class="stats"><span><b>${vs.length}</b>vídeos</span><span><b>${vs.filter(v=>v.st==='ok').length}</b>aprovados</span><span><b>${c.regras.length}</b>aprendidas</span></div>
   <div class="cap"><button class="capbtn pri" data-sheet="nova:${id}">Nova edição</button><button class="capbtn" data-toast="Abrindo a pasta da cliente no Drive">Pasta no Drive</button></div></div>
  <div class="seg" data-cli="${id}">${[['videos','Vídeos'],['dna','DNA'],['refs','Referências']].map(([k,n])=>`<button data-seg="${k}" class="${seg===k?'on':''}">${n}</button>`).join('')}</div>
  ${seg==='videos'?`<h3>Vídeos</h3>${vs.length?`<div class="group">${vs.map(vidRow).join('')}</div>`:'<div class="group empty">Nenhum vídeo ainda</div>'}`:''}
  ${seg==='dna'?`<h3>Padrão</h3><div class="group">${c.dna.map(([a,b])=>`<div class="row plain"><span class="tx"><small style="margin:0">${a}</small><b style="font-size:14px">${b}</b></span></div>`).join('')}
    <div class="row plain"><span class="tx"><small style="margin:0">Paleta</small></span><span style="padding-left:6px">${c.cores.map(x=>`<span class="sw-col" style="background:${x}"></span>`).join('')}</span></div></div>
   <h3>Aprendido nos ajustes</h3><div class="group">${c.regras.map(x=>`<div class="row plain"><span class="tx"><b style="font-size:14px">${x}</b></span></div>`).join('')||'<div class="empty">Cada ajuste que você pedir pode virar regra aqui</div>'}</div>`:''}
  ${seg==='refs'?`<h3>Aprovados que guiam o padrão</h3><div class="reels">${vs.filter(v=>v.st==='ok').map(reel).join('')||'<p class="empty">A primeira aprovação vira referência</p>'}</div>`:''}`},
 video(id){const v=vid(id),c=cli(v.cli);
  return `<div class="nav solid"><button class="back" data-pop>‹ ${c.nome.split(' ').slice(0,2).join(' ')}</button><span class="t">${v.tema}</span><button class="round" aria-label="Compartilhar" data-toast="Link da prévia copiado">${SV('<path d="M12 15V3M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>')}</button></div>
  <div class="vid">${cover(v,1)}</div>
  <div class="tags"><span class="tag">v${v.v} · 480p HDR</span><span class="tag">${v.dur}</span><span class="tag">sem música</span></div>
  ${v.st==='run'?`<h3>Editando</h3><div class="group">${['Transcrição','Storytelling e gancho','Cortes de pausa','Textos e B-rolls','Prévia 480p'].map((e,i)=>`<div class="row plain"><span class="tx"><b style="font-size:14px;color:${i/5<v.prog?'var(--txt)':'var(--sub)'}">${e}</b></span>${i/5<v.prog-.2?'<span class="check">✓</span>':i/5<v.prog?'<span style="color:var(--sub);font-size:13px">agora</span>':''}</div>`).join('')}</div>`:''}
  ${v.hist.length?`<h3>Versões</h3><div class="group tl">${v.hist.slice().reverse().map(([a,b,d])=>`<div class="row"><span class="dot"></span><span class="tx"><b>${a} · ${b}</b><small style="white-space:normal">${d}</small></span></div>`).join('')}</div>`:''}
  ${v.st==='ok'?`<h3>Entrega</h3><div class="group">${[['Final 4K HDR','.zip pra baixar no celular'],['Sem legenda','pra trilha e efeitos no CapCut'],['Legendas .srt',''],['Capa','1080 × 1920']].map(([a,b])=>`<button class="row plain" data-toast="Baixando ${a}"><span class="tx"><b>${a}</b>${b?`<small>${b}</small>`:''}</span><span style="color:var(--orange)">${SV('<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>')}</span></button>`).join('')}</div>`:''}
  ${v.st==='wait'?`<div class="dock" data-dock><button class="capbtn" data-sheet="ajuste:${id}">Pedir ajuste</button><button class="capbtn pri" data-aprovar="${id}">Aprovar</button></div>`:''}`}
};
function sheetNova(pre){if(pre)S.novaCli=pre;const c=cli(S.novaCli);return `<div class="grab"></div><div class="sh"><button data-close>Cancelar</button><b>Nova edição</b><button data-iniciar>Iniciar</button></div>
 <h3>Cliente</h3><div class="group">${DB.clientes.map(x=>`<button class="row" data-nc="${x.id}"><span class="av ${x.cls}">${x.ini}</span><span class="tx"><b>${x.nome}</b><small>${x.area}</small></span>${x.id===S.novaCli?'<span class="check">✓</span>':''}</button>`).join('')}</div>
 <h3>Vídeo bruto</h3><label class="drop" for="arq">${SV('<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>')}<b id="arqn">Escolher do iPhone</b>ou puxar da pasta ${c.nome.split(' ').pop()} no Drive</label><input type="file" id="arq" accept="video/*" hidden>
 <h3>Vai sair com</h3><div class="group"><div class="row plain"><span class="tx"><b style="font-size:14px">Padrão ${c.nome}</b><small>${c.dna.slice(0,3).map(x=>x[1]).join(' · ')}</small></span></div></div>`}
function sheetAjuste(id){const v=vid(id),c=cli(v.cli);return `<div class="grab"></div><div class="sh"><button data-close>Cancelar</button><b>Pedir ajuste</b><button data-enviar="${id}">Enviar</button></div>
 <p class="lead" style="margin:6px 0 10px">Escreve do seu jeito, como falaria com o editor</p>
 <textarea id="aj" placeholder="Ex.: muda o subtítulo pra 'pode prejudicar seus rins?' e deixa as três linhas alinhadas"></textarea>
 <div class="chips">${['Cortar um trecho','Trocar o gancho','Legenda mais branca','Trocar o B-roll','Mudar título'].map(x=>`<button class="chip" data-chip="${x}">${x}</button>`).join('')}</div>
 <div class="group"><button class="row plain" data-sw><span class="tx"><b>Guardar no DNA</b><small>Vale pros próximos vídeos da ${c.nome.split(' ').slice(0,2).join(' ')}</small></span><span class="sw ${S.dnaOn?'':'off'}"></span></button></div>`}

function render(anim){const st=$('#stack');const top=S.stack[S.stack.length-1];const [name,...args]=top.v.split(':');
 const el=document.createElement('div');el.className='view'+(anim==='push'?' in':'');el.innerHTML=V[name](...args);
 const old=st.lastElementChild;st.appendChild(el);
 if(anim==='push'){requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('in');old&&old.classList.add('out')}));setTimeout(()=>old&&old.remove(),400)}
 else if(anim==='pop'){el.classList.add('out');requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('out');old&&old.classList.add('in')}));setTimeout(()=>old&&old.remove(),400)}
 else old&&old.remove();
 el.addEventListener('scroll',()=>{const n=el.querySelector('.nav');n&&n.classList.toggle('solid',el.scrollTop>40||name==='video')});
 $('#tabbar').hidden=name==='video'&&!!el.querySelector('[data-dock]');
 document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab))}
function sheet(html){$('#sheet').innerHTML=html;$('#sheet').classList.add('on');$('#dim').classList.add('on')}
function close(){$('#sheet').classList.remove('on');$('#dim').classList.remove('on')}
document.addEventListener('click',e=>{const b=e.target.closest('button,#dim');if(!b)return;const d=b.dataset||{};
 if(b.id==='dim'||'close' in d)return close();
 if(d.tab){S.tab=d.tab;S.stack=[{v:d.tab}];S.seg='videos';render()}
 else if(d.push){const[p,id,seg]=d.push.split(':');if(seg)S.seg=seg;else if(p==='cliente')S.seg='videos';S.stack.push({v:p+':'+id});render('push')}
 else if('pop' in d){S.stack.pop();render('pop')}
 else if(d.seg){S.seg=d.seg;const top=S.stack[S.stack.length-1];render()}
 else if(d.sheet){const[k,a]=d.sheet.split(':');sheet(k==='nova'?sheetNova(a):sheetAjuste(a))}
 else if(d.nc){S.novaCli=d.nc;$('#sheet').innerHTML=sheetNova()}
 else if('iniciar' in d){const n=($('#arqn').textContent.startsWith('Escolher')?'Novo vídeo':$('#arqn').textContent);
  const v={id:'n'+Date.now(),cli:S.novaCli,t:'Novo vídeo',tema:n.slice(0,12),sub:'em edição',dur:'—',st:'run',v:1,prog:.05,hist:[]};DB.videos.unshift(v);close();
  S.tab='inicio';S.stack=[{v:'inicio'}];render();toast('Editando no padrão '+cli(v.cli).nome.split(' ').slice(0,2).join(' '));andar(v)}
 else if(d.chip){const t=$('#aj');t.value=(t.value?t.value+'. ':'')+d.chip;t.focus()}
 else if('sw' in d){S.dnaOn=!S.dnaOn;b.querySelector('.sw').classList.toggle('off',!S.dnaOn)}
 else if(d.enviar){const t=$('#aj').value.trim();if(!t)return toast('Escreve o que precisa mudar');const v=vid(d.enviar);
  if(S.dnaOn)cli(v.cli).regras.unshift(t);v.v++;v.hist.push(['v'+v.v,'Seu ajuste',t]);v.st='run';v.prog=.05;close();render();toast(S.dnaOn?'Ajuste enviado e guardado no DNA':'Ajuste enviado');andar(v)}
 else if(d.aprovar){const v=vid(d.aprovar);v.st='ok';v.hist.push(['v'+v.v,'Aprovado','Gerando 4K, versão sem legenda, .srt e capa']);render();toast('Aprovado. Gerando o 4K')}
 else if(d.toast)toast(d.toast)});
document.addEventListener('change',e=>{if(e.target.id==='arq'&&e.target.files[0])$('#arqn').textContent=e.target.files[0].name.replace(/\.[^.]+$/,'')});
function andar(v){const t=setInterval(()=>{v.prog=Math.min(1,v.prog+.12);if(v.prog>=1){clearInterval(t);v.st='wait';if(!v.hist.length)v.hist.push(['v1','Primeira versão','Cortes, storytelling e textos no padrão da cliente']);toast(v.tema+': prévia pronta pra validar')}
 const top=S.stack[S.stack.length-1].v;if(!$('#sheet').classList.contains('on')){const sc=$('#stack').lastElementChild.scrollTop;render();$('#stack').lastElementChild.scrollTop=sc}},700)}
render();
</script>
