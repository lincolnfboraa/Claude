<meta charset="utf-8">
<title>Bora Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@600;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: app iOS-like num frame de celular. Pilha de navegação (push), barras translúcidas, listas agrupadas, sheets de baixo pra cima */
:root{
  --bg:#06182C; --bg2:#0A2340; --glass:rgba(16,42,72,.62); --cell:rgba(255,255,255,.055); --sep:rgba(255,255,255,.08);
  --orange:#FF6115; --cream:#F3EEE6; --txt:#F3F6FA; --sub:rgba(235,240,247,.58); --ok:#34C77B; --warn:#FFB340;
  --ui:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif; --brand:'Lexend',var(--ui);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#030E1B;color:var(--txt);font-family:var(--ui);display:flex;justify-content:center;align-items:flex-start;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.phone{position:relative;width:100%;max-width:400px;height:820px;max-height:calc(100vh - 40px);min-height:640px;border-radius:44px;overflow:hidden;
  background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5)}
.glow{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(260px 220px at 90% -4%,rgba(255,97,21,.30),transparent 70%),
  radial-gradient(300px 260px at -10% 40%,rgba(48,110,180,.35),transparent 70%)}
.view{position:absolute;inset:0;overflow-y:auto;padding:0 16px 120px;transition:transform .35s cubic-bezier(.3,.8,.2,1),opacity .35s;background:transparent}
.view.out{transform:translateX(-28%);opacity:0;pointer-events:none}.view.in{transform:translateX(100%)}
.nav{position:sticky;top:0;z-index:5;margin:0 -16px;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;min-height:54px;
  background:linear-gradient(var(--bg) 0,rgba(6,24,44,.75) 100%);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.nav .t{font-weight:600;font-size:16px;opacity:0;transition:opacity .2s}.nav.solid .t{opacity:1}
.back{color:var(--orange);font-size:16px;display:flex;align-items:center;gap:2px}
.round{width:34px;height:34px;border-radius:50%;background:var(--cell);display:grid;place-items:center}
.round svg,.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 18px}
.brand{height:34px;width:auto;display:block}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:24px 4px 8px;display:flex;justify-content:space-between}
h3 button{color:var(--orange);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
.group{background:var(--cell);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--sep)}
.row.plain+.row.plain::before{left:14px}
.row .tx{flex:1;min-width:0}.row b{display:block;font-weight:500;font-size:15px}.row small{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:rgba(255,255,255,.3);font-size:18px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;background:#1C3E66}
.av.f{background:linear-gradient(140deg,#C8B9A7,#8FB0D8);color:#0F1C4A}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--orange);color:#fff}
.cta{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;text-align:left;background:linear-gradient(135deg,#FF6115,#FF8A3D);color:#fff;box-shadow:0 10px 30px rgba(255,97,21,.3)}
.cta .p{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.cta b{display:block;font-size:17px}.cta small{opacity:.85;font-size:13px}
.reels{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.reel{flex:0 0 128px;scroll-snap-align:start;text-align:left}
.cover{aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(170deg,#4A6A8E,#1B3350 60%,#0C1B2E)}
.cover.c2{background:linear-gradient(170deg,#7A5B4B,#3B2A24 60%,#160E0B)}
.cover .tt{position:absolute;left:8px;right:8px;top:44%;text-align:center;font-size:7px;letter-spacing:.3em;color:#8FB0D8}
.cover .tt i{display:block;font:italic 900 19px Georgia,serif;letter-spacing:.04em;margin:2px 0}
.cover .tt span{color:#fff;font-size:8px;letter-spacing:0;font-weight:600}
.cover .st{position:absolute;top:8px;left:8px}
.pillst{font-size:11px;font-weight:600;padding:4px 8px;border-radius:99px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(0,0,0,.35)}
.pillst.ok{color:var(--ok)}.pillst.wait{color:var(--warn)}.pillst.run{color:#fff}
.reel b{display:block;font-size:13px;font-weight:500;margin-top:7px;line-height:1.3}.reel small{color:var(--sub);font-size:12px}
.ring{width:38px;height:38px;flex:none}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;height:64px;border-radius:32px;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;
  background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.35)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub)}
.tabbar button.on{color:var(--orange)}
.tabbar .plus{width:48px;height:48px;border-radius:50%;background:var(--orange);color:#fff;justify-self:center;display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,97,21,.45)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cell);border-radius:10px;padding:2px;margin:16px 0 4px}
.seg button{padding:7px;border-radius:8px;font-size:13px;font-weight:500;color:var(--sub)}.seg button.on{background:rgba(255,255,255,.14);color:var(--txt)}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:4px}
.head .av{width:76px;height:76px;font-size:26px}
.head h1{font-size:24px;margin:4px 0 0}.head p{margin:0;color:var(--sub);font-size:14px}
.stats{display:flex;justify-content:center;gap:22px;margin-top:8px;font-size:13px;color:var(--sub)}.stats b{color:var(--txt);font-size:16px;display:block}
.cap{display:flex;gap:8px;margin-top:14px;width:100%}
.capbtn{flex:1;padding:11px;border-radius:99px;background:var(--cell);font-weight:600;font-size:14px}.capbtn.pri{background:var(--orange);color:#fff}
.vid{width:66%;margin:6px auto 0}
.vid .cover{border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.play{position:absolute;inset:auto 0 12px;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center}
.leg{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:9px;text-shadow:0 1px 3px #000}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 0}
.tag{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--cell);color:var(--sub)}
.tl .row{align-items:flex-start}.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);margin:5px 14px 0 4px;flex:none}
.tl .row+.row::before{left:28px}
.dock{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;display:flex;gap:8px;padding:8px;border-radius:32px;background:var(--glass);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.dock .capbtn{padding:13px}
.dim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;border-radius:28px 28px 0 0;padding:8px 16px 28px;max-height:88%;overflow-y:auto;
  background:rgba(14,38,66,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transform:translateY(105%);transition:transform .38s cubic-bezier(.3,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.sh b{font-size:17px}.sh button{color:var(--orange);font-size:16px}
.drop{border:1.5px dashed rgba(255,255,255,.2);border-radius:18px;padding:22px;text-align:center;color:var(--sub);font-size:14px;display:block;cursor:pointer}
.drop b{display:block;color:var(--txt);font-size:15px;margin:6px 0 2px}
.check{color:var(--orange);font-weight:700}
textarea{width:100%;min-height:96px;border:0;border-radius:14px;background:var(--cell);color:var(--txt);padding:12px 14px;font:inherit;font-size:15px;resize:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px;padding:0 16px}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:99px;background:var(--cell)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--ok);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.off{background:rgba(255,255,255,.16)}.sw.off::after{left:2px}
.toast{position:absolute;top:14px;left:50%;z-index:40;transform:translate(-50%,-80px);transition:transform .35s;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;
  background:rgba(30,60,96,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.toast.on{transform:translate(-50%,0)}
.sw-col{display:inline-block;width:22px;height:22px;border-radius:50%;margin-left:-6px;border:2px solid var(--bg)}
.fld{width:100%;border:0;background:transparent;color:var(--txt);font:inherit;font-size:15px;padding:0}
.fld:focus{outline:none}.fld.s{color:var(--sub);font-size:13px}
.x{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.1);color:var(--sub);font-size:14px;flex:none;display:grid;place-items:center}
.add{color:var(--orange);font-size:15px;font-weight:500}
.pal{display:flex;gap:12px;flex-wrap:wrap;padding:14px}
.pc{position:relative;width:46px;height:46px}
.pc input{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.2);padding:0;background:none;cursor:pointer;overflow:hidden}
.pc input::-webkit-color-swatch-wrapper{padding:0}.pc input::-webkit-color-swatch{border:0;border-radius:50%}.pc input::-moz-color-swatch{border:0;border-radius:50%}
.pc .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;font-size:11px;background:#2A4A70}
.pc.new{border:1.5px dashed rgba(255,255,255,.3);border-radius:50%;display:grid;place-items:center;color:var(--sub);font-size:22px}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.op{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18);flex:none}
.op.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--orange)}
.op.cus{position:relative;overflow:hidden;background:conic-gradient(#f55,#fd5,#5d8,#5bf,#a6f,#f55)}
.op.cus input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.prev{border-radius:16px;padding:18px 14px;text-align:center;background:linear-gradient(170deg,#4A6A8E,#1B3350 70%);font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.prev em{font:italic 900 22px Georgia,serif;display:block;margin-top:4px}
.rola{max-height:calc(62px * 5);overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity}.rola .row{min-height:62px;scroll-snap-align:start}
.hcli{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:4px 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none}.hcli::-webkit-scrollbar{display:none}
.hc{flex:0 0 76px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;line-height:1.25;color:var(--sub)}
.hc .av{width:54px;height:54px;font-size:16px;transition:box-shadow .2s}.hc.on{color:var(--txt);font-weight:600}.hc.on .av{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--orange)}
.dnap{display:inline-block;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;flex:none}.dnap.sm{font-size:10px;padding:3px 7px;margin-left:6px;text-transform:none;letter-spacing:0}
.dnap.pv{background:rgba(255,179,64,.15);color:var(--warn);border:1px dashed rgba(255,179,64,.5)}.dnap.okp{background:rgba(52,199,123,.14);color:var(--ok)}
.aviso{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;margin-top:14px;color:var(--sub)}.aviso b{display:block;font-size:14px;margin-bottom:2px}
.aviso.pv{background:rgba(255,179,64,.08);border:1px dashed rgba(255,179,64,.45)}.aviso.pv b{color:var(--warn)}.aviso.okp{background:rgba(52,199,123,.08)}.aviso.okp b{color:var(--ok)}.aviso span{color:var(--txt)}
.note2{color:var(--sub);font-size:12.5px;line-height:1.45;margin:14px 4px 0}
.mini{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.1);flex:none}.mini.ok{background:var(--orange);color:#fff}
.fb{display:block;margin-top:6px;font-size:13px;padding:8px 10px;border-radius:10px;background:rgba(255,97,21,.12);color:var(--txt);line-height:1.4}
.tl .dot.revisao{background:var(--warn)}.tl .dot.aprovada{background:var(--ok)}.tl .dot.ajuste{background:var(--orange)}.tl .dot.editando{background:#fff}
.lk{color:var(--orange);flex:none;display:grid;place-items:center;width:30px;height:30px}
.head .dnap{margin-top:2px}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:sticky;top:58px;z-index:4;padding:8px;border-radius:30px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.acoes .capbtn{padding:12px}.tag.info{color:var(--txt);cursor:pointer}
.rolav{max-height:290px;overflow-y:auto;overscroll-behavior:contain}
a.row{color:inherit;text-decoration:none}
.empty{color:var(--sub);font-size:14px;padding:14px}
@media (prefers-reduced-motion:reduce){.view,.sheet,.toast,.dim{transition:none}}
</style>

<div class="phone" id="ph">
  <div class="glow"></div>
  <div id="stack"></div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação">
    <button data-tab="inicio" class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-tab="clientes"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg>Clientes</button>
    <button class="plus" data-sheet="nova" aria-label="Nova edição"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="validar"><svg class="ico" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M10.5 9.5l4 2.5-4 2.5z"/></svg>Validar</button>
    <button data-tab="dna"><svg class="ico" viewBox="0 0 24 24"><path d="M7 3c0 6 10 6 10 12s-10 0-10 6M17 3c0 6-10 6-10 12M9 6h6M9 18h6"/></svg>DNA</button>
  </nav>
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="config.js"></script>

 <h3>Informações</h3><div class="group"><div class="row plain"><input class="fld" id="e_nome" value="${esc(c.nome)}" aria-label="Nome"></div><div class="row plain"><input class="fld" id="e_seg" value="${esc(c.segmento)}" aria-label="Segmento"></div></div>
 <h3>Paleta</h3><div class="group"><div class="pal">${c.paleta.cores.map((x,i)=>`<span class="pc"><input type="color" class="e_cor" value="${x}" aria-label="Cor ${i+1}"><button class="x" data-rmcor="${i}" aria-label="Remover cor">×</button></span>`).join('')}<button class="pc new" data-addcor aria-label="Adicionar cor">+</button></div></div>
 <h3>Cores padrão do texto</h3><div class="group">${[['legenda','Legenda'],['destaque','Destaques']].map(([k,n])=>`<div class="row plain"><span class="tx"><b>${n}</b></span><span class="pc" style="width:34px;height:34px"><input type="color" id="e_${k}" value="${c.texto[k]||'#FFFFFF'}" style="width:34px;height:34px" aria-label="Cor ${n}"></span></div>`).join('')}</div>
 <h3>Diretrizes</h3><div class="group">${PARES.map(([k,n])=>`<div class="row plain"><span class="tx"><small style="margin:0">${n}</small><input class="fld e_p" data-k="${k}" value="${esc(c[k])}" aria-label="${n}"></span></div>`).join('')}</div>
 ${[...LISTAS,['regras_confirmadas','Regras confirmadas']].map(([k,n])=>`<h3>${n}</h3><div class="group">${(c[k]||[]).map((x,i)=>`<div class="row plain"><span class="tx"><input class="fld e_l" data-l="${k}" value="${esc(x)}" aria-label="${n}"></span><button class="x" data-rml="${k}:${i}" aria-label="Remover">×</button></div>`).join('')}<button class="row plain add" data-addl="${k}">+ Adicionar</button></div>`).join('')}
 <p class="note2">Salvar aqui é uma confirmação sua: as mudanças passam a valer pros próximos vídeos deste cliente.</p>`}
function lerDraft(){const d=S.draft,q=s=>[...document.querySelectorAll(s)];d.nome=$('#e_nome').value;d.segmento=$('#e_seg').value;d.paleta.cores=q('.e_cor').map(e=>e.value);
 d.texto.legenda=$('#e_legenda').value;d.texto.destaque=$('#e_destaque').value;q('.e_p').forEach(e=>d[e.dataset.k]=e.value);
 [...LISTAS,['regras_confirmadas']].forEach(([k])=>d[k]=q(`.e_l[data-l="${k}"]`).map(e=>e.value).filter(Boolean))}
function sheetAjuste(id){const v=vid(id),c=cli(v.cli);return `<div class="grab"></div><div class="sh"><button data-close>Cancelar</button><b>Pedir ajuste na v${vatual(v).n}</b><button data-enviar="${id}">Enviar</button></div>
 <p class="lead" style="margin:6px 0 10px">Escreve do seu jeito, como falaria com o editor. Fica registrado nesta versão.</p>
 <textarea id="aj" placeholder="Ex.: muda o subtítulo do início e deixa as três linhas alinhadas"></textarea>
 <div class="chips">${['Cortar um trecho','Trocar o gancho','Legenda mais branca','Trocar o B-roll','Mudar título'].map(x=>`<button class="chip" data-chip="${x}">${x}</button>`).join('')}</div>
 <div class="group"><button class="row plain" data-sw><span class="tx"><b>Sugerir pro DNA</b><small style="white-space:normal">Depois da aprovação, aparece como sugestão no DNA de ${esc(c.nome)}. Só vira regra se você confirmar</small></span><span class="sw ${S.sugerir?'':'off'}"></span></button></div>`}
function sheetSug(c){return `<div class="grab"></div><div class="sh"><button data-close>Depois</button><b>Atualizar o DNA?</b><span style="width:52px"></span></div>
 <p class="lead" style="margin:6px 0 10px">Estes ajustes foram aceitos na aprovação. Confirme só o que deve valer pros próximos vídeos de ${esc(c.nome)}.</p>
 <div class="group">${c.sugestoes.map((x,i)=>`<div class="row plain"><span class="tx"><b style="font-size:14px;font-weight:400;white-space:normal">${esc(x.texto)}</b><small>da v${x.versao} de ${esc(x.projeto)}</small></span><button class="mini ok" data-sugok="${c.id}:${i}">Confirmar</button><button class="mini" data-sugno="${c.id}:${i}" aria-label="Ignorar">✕</button></div>`).join('')}</div>`}

function render(anim){const st=$('#stack');const top=S.stack[S.stack.length-1];const [name,...args]=top.v.split(':');
 const el=document.createElement('div');el.className='view'+(anim==='push'?' in':'');el.innerHTML=V[name](...args);
 const old=st.lastElementChild;st.appendChild(el);
 if(anim==='push'){requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('in');old&&old.classList.add('out')}));setTimeout(()=>old&&old.remove(),400)}
 else if(anim==='pop'){el.classList.add('out');requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('out');old&&old.classList.add('in')}));setTimeout(()=>old&&old.remove(),400)}
 else old&&old.remove();
 el.addEventListener('scroll',()=>{const n=el.querySelector('.nav');n&&n.classList.toggle('solid',el.scrollTop>40||name==='video')});
 $('#tabbar').hidden=false;
 document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab))}
function sheet(html){$('#sheet').innerHTML=html;$('#sheet').classList.add('on');$('#dim').classList.add('on')}
function close(){$('#sheet').classList.remove('on');$('#dim').classList.remove('on')}
function reSheet(){const sc=$('#sheet').scrollTop;$('#sheet').innerHTML=sheetEditar();$('#sheet').scrollTop=sc}
function decidir(ref,ok){const[id,i]=ref.split(':'),c=cli(id),sg=c.sugestoes[+i];if(!sg)return;
 (async()=>{await q(sb.rpc('confirmar_sugestao',{p_sugestao:sg.id,p_confirmar:ok}));await recarregar();const n=cli(id);
  if($('#sheet').classList.contains('on')){if(n.sugestoes.length)$('#sheet').innerHTML=sheetSug(n);else close()}toast(ok?'Regra adicionada: DNA nova versão':'Sugestão ignorada')})()}
document.addEventListener('click',e=>{const b=e.target.closest('button,#dim');if(!b)return;const d=b.dataset||{};
 if(b.id==='dim'||'close' in d)return close();
 if(d.tab){S.tab=d.tab;S.stack=[{v:d.tab}];S.seg='videos';render()}
 else if(d.push){const[p,id,seg]=d.push.split(':');if(p==='cliente'){carregarPerfil(id);S.seg=seg||'videos'}S.stack.push({v:p+':'+id});render('push')}
 else if('pop' in d){S.stack.pop();render('pop')}
 else if(d.seg){S.seg=d.seg;render()}
 else if(d.sheet){const[k,a]=d.sheet.split(':');if(k==='editar'){S.draft=JSON.parse(JSON.stringify(cli(a)));S.draftId=a;return sheet(sheetEditar())}
  if(k==='nova'){S.arqn='';if(!a)S.cores=null}sheet(k==='nova'?sheetNova(a):sheetAjuste(a))}
 else if(d.cor){const[k,x]=d.cor.split(':');S.cores[k]=x;$('#sheet').innerHTML=sheetNova()}
 else if('addcor' in d){lerDraft();S.draft.paleta.cores.push('#FFFFFF');reSheet()}
 else if(d.rmcor){lerDraft();S.draft.paleta.cores.splice(+d.rmcor,1);reSheet()}
 else if(d.addl){lerDraft();(S.draft[d.addl]=S.draft[d.addl]||[]).push(' ');reSheet();const v=[...document.querySelectorAll(`.e_l[data-l="${d.addl}"]`)].pop();v&&(v.value='',v.focus())}
 else if(d.rml){lerDraft();const[k,i]=d.rml.split(':');S.draft[k].splice(+i,1);reSheet()}
 else if('salvar' in d){lerDraft();const c=cli(S.draftId),dd=S.draft;if(dd.paleta.cores.length&&dd.paleta.origem==='pendente')dd.paleta.origem='observada_validar';
  const dna={};['essencia','tom','storytelling','ritmo_resumo','duracao','ganchos','edicao','legendas_identidade','evitar','paleta','texto','padroes_extraidos','referencias_conhecidas','pendencias','regras_confirmadas'].forEach(k=>{if(dd[k]!==undefined)dna[k]=dd[k]});
  (async()=>{await q(sb.from('clientes').update({nome:dd.nome,segmento:dd.segmento}).eq('id',c.id));
   await q(sb.from('dna_versoes').insert({cliente_id:c.id,numero:c.dna_numero+1,dna,motivo:'Edição manual do perfil',confirmado_por:(await sb.auth.getUser()).data.user.id}));
   if(S.novaCli===c.id)S.cores=null;close();await recarregar();toast('Perfil salvo como DNA v'+(c.dna_numero+1))})()}
 else if(d.nc){if(d.nc!==S.novaCli){S.novaCli=d.nc;S.cores=null}const x=$('#hcli').scrollLeft;$('#sheet').innerHTML=sheetNova();const h=$('#hcli');h.scrollLeft=x;const o=h.querySelector('.on');if(o){const l=o.offsetLeft-16,r=o.offsetLeft+o.offsetWidth-h.clientWidth+16;if(h.scrollLeft>l)h.scrollTo({left:l,behavior:'smooth'});else if(h.scrollLeft<r)h.scrollTo({left:r,behavior:'smooth'})}}
 else if('iniciar' in d){const c=cli(S.novaCli),n=S.arqn||'Novo vídeo';
  (async()=>{const [p]=await q(sb.from('projetos').insert({cliente_id:c.id,titulo:n,status:'editando',dna_versao_id:c.dna_versao_id,cores_texto:{...S.cores},original_meta:{arq:S.arqn||'Arquivo do Drive'}}).select());
   await q(sb.from('versoes').insert({projeto_id:p.id,numero:1,status:'editando',resumo:'Primeira versão no DNA de '+c.nome}));
   close();S.tab='inicio';S.stack=[{v:'inicio'}];await recarregar();toast('Projeto criado. Na fila do render')})()}
 else if(d.chip){const t=$('#aj');t.value=(t.value?t.value+'. ':'')+d.chip;t.focus()}
 else if('sw' in d){S.sugerir=!S.sugerir;b.querySelector('.sw').classList.toggle('off',!S.sugerir)}
 else if(d.enviar){const t=$('#aj').value.trim();if(!t)return toast('Escreve o que precisa mudar');const v=vid(d.enviar),a=vatual(v);
  (async()=>{await q(sb.from('versoes').update({feedback:t,status:'ajuste',sugerir_dna:S.sugerir}).eq('id',a.id));
   await q(sb.from('versoes').insert({projeto_id:v.id,numero:a.n+1,status:'editando',resumo:'Ajuste da v'+a.n}));
   await q(sb.from('projetos').update({status:'editando'}).eq('id',v.id));close();await recarregar();toast('Feedback registrado na v'+a.n+'. v'+(a.n+1)+' na fila')})()}
 else if(d.aprovar){const v=vid(d.aprovar);(async()=>{await q(sb.rpc('aprovar_projeto',{p_projeto:v.id}));await recarregar();toast('Aprovado. Final sai dos originais');const c=cli(v.cli);if(c.sugestoes.length)setTimeout(()=>sheet(sheetSug(c)),500)})()}
 else if('entrar' in d){(async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#lmail').value.trim(),password:$('#lsenha').value});if(error){const m=error.message||'';$('#lerr').textContent=/confirm/i.test(m)?'Esse e-mail ainda não foi confirmado no Supabase':/invalid/i.test(m)?'E-mail ou senha não conferem':'Erro ao entrar: '+m;return}iniciar()})()}
 else if('sair' in d){sb.auth.signOut().then(()=>{S.stack=[{v:'login'}];render()})}
 else if(d.info){const v=vid(d.info),m=v.media||{};sheet(`<div class="grab"></div><div class="sh"><span style="width:52px"></span><b>Mídia original</b><button data-close>OK</button></div>
  <div class="group">${par('Arquivo',m.arq||'—')}${par('Resolução',m.res||'Inspecionando')}${par('Quadros',m.fps||'—')}${par('Cor',m.cor||'—')}${par('Preservação','Cor, pele, rosto e enquadramento como gravados; sem filtro ou suavização')}${par('Final','Renderizado de novo a partir dos originais, na resolução nativa')}</div>`)}
 else if(d.play){const v=vid(d.play),a=vatual(v);if(!a.previa)return toast('A prévia da v'+a.n+' ainda não foi enviada');
  (async()=>{const {data,error}=await sb.storage.from('previas').createSignedUrl(a.previa,3600);if(error)return toast('Não abriu a prévia: '+error.message);
   $('#vid').innerHTML=`<video src="${data.signedUrl}" controls autoplay playsinline style="width:100%;aspect-ratio:9/16;border-radius:22px;background:#000"></video>`})()}
 else if(d.sugok)decidir(d.sugok,true);else if(d.sugno)decidir(d.sugno,false);
 else if(d.toast)toast(d.toast)});
document.addEventListener('change',e=>{if(e.target.id==='upprev'&&e.target.files[0]){const v=vid(e.target.dataset.proj),a=vatual(v),f=e.target.files[0],path=`${v.cli}/${v.id}/v${a.n}.mp4`;
  toast('Enviando prévia…');(async()=>{const {error}=await sb.storage.from('previas').upload(path,f,{upsert:true,contentType:'video/mp4'});if(error)return toast('Falhou: '+error.message);
   await q(sb.from('versoes').update({previa_path:path}).eq('id',a.id));await recarregar();toast('Prévia da v'+a.n+' enviada')})();return}
if(e.target.id==='arq'&&e.target.files[0]){S.arqn=e.target.files[0].name.replace(/\.[^.]+$/,'');$('#arqn').textContent=S.arqn}
 if(e.target.dataset.cc){S.cores[e.target.dataset.cc]=e.target.value;$('#sheet').innerHTML=sheetNova()}});
async function iniciar(){S.stack=[{v:'carregando'}];render();try{await carregarTudo();S.stack=[{v:'inicio'}];render()}catch(e){S.stack=[{v:'erro'}];render()}}
sb.auth.getSession().then(({data})=>{if(data.session)iniciar();else{S.stack=[{v:'login'}];render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#flogin')){e.preventDefault();document.querySelector('[data-entrar]').click()}});
</script>
