<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bora Studio">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest.json">
<title>Bora Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Bora Studio: app mobile-first na linguagem do site da Bora (azul profundo, laranja só em ação, bege em destaque) */
:root{
  --bg:#0D1622; --deep:#070A11; --ink:#04060B;
  --orange:#FF5E16; --orange-soft:rgba(255,94,22,.16); --beige:#F2EADF;
  --txt:#F4F2EE; --sub:rgba(242,234,223,.60); --faint:rgba(242,234,223,.38);
  --line:rgba(242,234,223,.09); --cell:rgba(242,234,223,.055); --cell2:rgba(242,234,223,.09);
  --glass:rgba(10,15,24,.62); --ok:#3CCB86; --warn:#F5B547;
  --display:'Lexend',system-ui,sans-serif; --ui:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --g:20px; --r:26px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--txt);font:15px/1.45 var(--ui);display:flex;justify-content:center;align-items:flex-start;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* moldura (desktop) e tela cheia (celular) */
.phone{position:relative;width:100%;max-width:430px;height:900px;max-height:calc(100vh - 40px);min-height:640px;border-radius:46px;overflow:hidden;
  background:radial-gradient(130% 55% at 50% 0%,#152234 0%,#0E1724 38%,#0A0F18 70%,var(--deep) 100%);box-shadow:0 0 0 1px rgba(242,234,223,.08),0 40px 90px rgba(0,0,0,.55)}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 var(--g) 128px;transition:transform .38s cubic-bezier(.3,.8,.2,1),opacity .38s;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.out{transform:translateX(-24%);opacity:0;pointer-events:none}.view.in{transform:translateX(100%)}

/* topo */
.top{position:sticky;top:0;z-index:6;margin:0 calc(var(--g)*-1);padding:14px var(--g) 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;
  transition:background .25s}
.top.solid{background:rgba(9,13,21,.76);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:0 1px 0 var(--line)}
.marca{display:flex;align-items:center;gap:9px}
.marca img{width:30px;height:30px}
.marca b{font:600 19px/1 var(--display);color:var(--orange);letter-spacing:-.01em}
.marca span{display:block;font:500 10.5px/1 var(--display);color:var(--beige);letter-spacing:.2em;margin-top:3px}
.icb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--cell);position:relative;color:var(--beige)}
.icb .pt{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--deep)}
.voltar{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 10px;border-radius:21px;background:var(--cell);color:var(--beige);font-weight:500;font-size:14px}
.top .tt{font:600 16px var(--display);opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.top.solid .tt{opacity:1}

/* tipografia */
.titulo{font:600 30px/1.1 var(--display);letter-spacing:-.025em;margin:6px 0 8px;text-wrap:balance}
.saud{margin:8px 0 2px;color:var(--sub);font:500 15px var(--display)}
.tit-ini{font-size:28px;margin-bottom:20px}
.titulo em{font-style:normal;color:var(--beige)}
.apoio{color:var(--sub);font-size:15px;margin:0 0 22px;max-width:34ch}
.secao{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 14px}
.secao h2{font:600 19px var(--display);letter-spacing:-.01em;margin:0}
.secao .cnt{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.secao button{font-size:14px;color:var(--beige);opacity:.8}

/* banner Nova edição */
.hero{position:relative;display:block;width:100%;border-radius:var(--r);overflow:hidden;min-height:214px;padding:22px 20px 20px;isolation:isolate;
  background:#0A1019 url(hero.jpg) 62% 40%/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(8,12,19,.96) 0%,rgba(8,12,19,.78) 46%,rgba(8,12,19,.12) 100%)}
.hero h3{font:600 23px/1.15 var(--display);letter-spacing:-.02em;margin:0 0 8px;max-width:13ch;color:var(--txt)}
.hero p{margin:0 0 22px;color:var(--sub);font-size:13.5px;max-width:24ch}
.neon{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:300px;height:62px;padding:0 10px 0 22px;border-radius:31px;
  background:rgba(8,12,19,.42);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:inset 0 0 0 1px rgba(255,94,22,.85),0 0 18px rgba(255,94,22,.28),inset 0 0 14px rgba(255,94,22,.10);font:500 16px var(--display);color:var(--txt);transition:transform .15s}
.neon i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-style:normal}
.neon:active{transform:scale(.98)}

/* trilho horizontal de vídeos: 2 inteiros + o terceiro aparecendo */
.trilho{display:flex;gap:12px;overflow-x:auto;margin:0 calc(var(--g)*-1);padding:0 var(--g) 4px;scroll-snap-type:x mandatory;scroll-padding:0 var(--g);scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.vcard{flex:0 0 calc((100% - var(--g) - 24px)/2.25);scroll-snap-align:start;display:block;min-width:0}
.capa{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:linear-gradient(165deg,#28415C 0%,#142538 55%,#0A121D 100%)}
.capa.c2{background:linear-gradient(165deg,#6A4A39 0%,#33241D 55%,#140C09 100%)}
.capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.capa.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(3,6,11,.45),transparent 30%,transparent 70%,rgba(3,6,11,.35))}
.capa.foto .cap-t{display:none}.capa .estado,.capa .anel{z-index:2}
.capa .cap-t{position:absolute;left:10px;right:10px;top:42%;text-align:center;font:500 7.5px var(--display);letter-spacing:.32em;color:#9DB8DA;text-transform:uppercase}
.capa .cap-t i{display:block;font:italic 900 22px/1.05 Georgia,serif;letter-spacing:.02em;margin:3px 0 4px;text-transform:none}
.capa .cap-t span{display:block;color:#fff;font:600 9px var(--ui);letter-spacing:0;text-transform:none}
.estado{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px 5px 8px;border-radius:99px;
  background:rgba(3,17,30,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.estado::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.estado.wait{color:var(--warn)}.estado.ok{color:var(--ok)}.estado.run{color:var(--beige)}
.vcard h4{font:500 15px/1.25 var(--display);margin:12px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard small{display:block;margin:0 2px;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capa .anel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,17,30,.45)}

/* anel da Bora: progresso funcional */
.bring{position:relative;display:grid;place-items:center}
.bring svg{width:100%;height:100%;overflow:visible}
.bring .orb{transform-origin:50% 50%;animation:orbita 6s linear infinite}
.bring .orb2{transform-origin:50% 50%;animation:orbita 9s linear infinite reverse}
.bring .pg{transition:stroke-dashoffset .8s cubic-bezier(.3,.8,.2,1)}
.bring b{position:absolute;font:600 15px var(--display);color:var(--txt);font-variant-numeric:tabular-nums}
@keyframes orbita{to{transform:rotate(360deg)}}

/* bloco de clientes (painel translúcido com rolagem própria) */
.painel{border-radius:var(--r);background:linear-gradient(180deg,rgba(242,234,223,.07),rgba(242,234,223,.035));
  box-shadow:inset 0 0 0 1px rgba(242,234,223,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:18px 6px 6px 18px;position:relative}
.painel .ph{display:flex;align-items:baseline;justify-content:space-between;padding-right:12px;margin-bottom:6px}
.painel .ph h2{font:600 19px var(--display);margin:0}
.legdna{display:flex;align-items:center;gap:6px}.legdna .dt{position:static;width:8px;height:8px;border-radius:50%;background:var(--ok)}.legdna .dt.pv{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn);margin-left:6px}
.painel .ph .cnt{font-size:13px;color:var(--faint)}
.lista-cli{max-height:338px;overflow-y:auto;padding-right:12px;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);padding-bottom:28px}
.lista-cli::-webkit-scrollbar{display:none}
.cli{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 0;border-top:1px solid var(--line)}
.cli:first-child{border-top:0}
.ini{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 14px var(--display);color:var(--beige);background:rgba(242,234,223,.08)}
.ini.f{background:var(--beige);color:#0F1C4A}
.cli .tx{flex:1;min-width:0}
.cli b{display:block;font:500 15.5px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli small{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden}
.ini{position:relative}
.ini .dt{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2.5px #111925}
.ini .dt.pv{background:#111925;box-shadow:0 0 0 2.5px #111925,inset 0 0 0 2px var(--warn)}
.dna{display:inline-flex;align-items:center;gap:5px;flex:none}
.dna::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.dna.pv::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}
.qtd{min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:var(--orange);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.seta{color:var(--faint);font-size:20px;line-height:1}

/* barra inferior flutuante */
.tabbar{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:20;width:calc(100% - 40px);max-width:360px;height:66px;border-radius:33px;
  display:grid;grid-template-columns:1fr 1fr 66px 1fr 1fr;align-items:center;padding:0 6px;
  background:rgba(12,17,27,.66);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  box-shadow:inset 0 0 0 1px rgba(242,234,223,.10),0 14px 34px rgba(0,0,0,.4)}
.tabbar button{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--faint);position:relative}
.tabbar button.on{color:var(--beige)}
.tabbar button.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--orange)}
.tabbar .mais{width:50px;height:50px;border-radius:50%;background:var(--orange);color:#fff;justify-self:center;box-shadow:0 8px 22px rgba(255,94,22,.38)}
.tabbar .mais::after{display:none}
.tabbar .bd{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}

/* listas e linhas genéricas */
.lst{border-radius:22px;background:var(--cell);overflow:hidden}
.ln{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;position:relative}
.ln+.ln{border-top:1px solid var(--line)}
.ln .tx{flex:1;min-width:0}.ln b{display:block;font-weight:500;font-size:15px}
.ln small{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.ln .mini-capa{width:44px;height:56px;border-radius:10px;flex:none;overflow:hidden}
.ln .mini-capa .capa{aspect-ratio:auto;height:100%;border-radius:10px}
.ln .mini-capa .cap-t,.ln .mini-capa .estado{display:none}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 24px;border-radius:28px;font:500 16px var(--display);background:var(--cell2);color:var(--txt)}
.pill.pri{background:var(--orange);color:#fff;box-shadow:0 10px 26px rgba(255,94,22,.30)}
.pill.full{width:100%}
.pill.sm{height:44px;padding:0 18px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--cell);color:var(--sub);font-size:12.5px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.vazio{color:var(--sub);font-size:14px;padding:18px 16px}
.nota{color:var(--faint);font-size:12.5px;line-height:1.5;margin:12px 4px 0}

/* cliente */
.cab-cli{display:flex;align-items:center;gap:16px;margin:4px 0 6px}
.cab-cli .ini{width:64px;height:64px;font-size:21px}
.cab-cli h1{font:600 28px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.cab-cli p{margin:4px 0 0;color:var(--sub);font-size:14px}
.selo{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:500;margin-top:14px}
.selo.ok{background:rgba(60,203,134,.12);color:var(--ok)}.selo.pv{background:rgba(245,181,71,.10);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(245,181,71,.35)}
.acoes2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:18px}

/* formulários (novo projeto) */
.rot{font:600 15px var(--display);margin:24px 2px 10px}
.campo{display:flex;align-items:center;gap:12px;width:100%;height:60px;padding:0 18px;border-radius:20px;background:var(--cell);position:relative}
.campo select{appearance:none;-webkit-appearance:none;flex:1;height:100%;border:0;background:transparent;color:var(--txt);font:500 16px var(--display)}
.campo select option{background:#0D1622}
.campo .seta{transform:rotate(90deg)}
.solta{border-radius:24px;padding:26px 18px;text-align:center;background:rgba(242,234,223,.03);box-shadow:inset 0 0 0 1.5px rgba(242,234,223,.16);
  background-image:url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='24' ry='24' stroke='%23F2EADF3A' stroke-width='2' stroke-dasharray='7 9' stroke-linecap='round'/%3e%3c/svg%3e");box-shadow:none}
.solta .nuvem{color:var(--orange);width:40px;height:40px;margin:0 auto 10px;display:block}
.solta b{display:block;font:500 16px var(--display)}
.solta small{display:block;color:var(--sub);font-size:13px;margin:4px 0 16px}
.solta label{display:inline-flex}
.thumbs{display:flex;gap:10px;overflow-x:auto;margin:14px calc(var(--g)*-1) 0;padding:6px var(--g) 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.th{position:relative;flex:0 0 104px;height:104px;border-radius:18px;overflow:hidden;background:#141C2A}
.th video{width:100%;height:100%;object-fit:cover;display:block}
.th .du{position:absolute;right:7px;bottom:7px;font-size:11px;font-weight:600;padding:3px 7px;border-radius:8px;background:rgba(3,17,30,.65)}
.th .rm{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(3,17,30,.7);display:grid;place-items:center;font-size:14px}
.th .nm{position:absolute;left:7px;bottom:7px;right:52px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--beige)}
textarea{width:100%;min-height:110px;border:0;border-radius:20px;background:var(--cell);color:var(--txt);padding:16px 18px;font:15px/1.5 var(--ui);resize:none}
textarea::placeholder{color:var(--faint)}
.dobra{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0 18px;border-radius:20px;background:var(--cell);font-weight:500}
.dobra .bolas{display:flex;gap:4px}.dobra .bolas i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px var(--deep)}
.cores{padding:16px 18px 18px;border-radius:0 0 20px 20px;background:var(--cell);margin-top:-14px;padding-top:28px}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.op{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(242,234,223,.2);flex:none}
.op.on{box-shadow:0 0 0 2px var(--deep),0 0 0 4px var(--orange)}
.op.cus{position:relative;overflow:hidden;background:conic-gradient(#f55,#fd5,#5d8,#5bf,#a6f,#f55)}
.op.cus input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.amostra{border-radius:16px;padding:16px;text-align:center;background:linear-gradient(170deg,#28415C,#111D2C);font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6);margin-bottom:6px}
.amostra em{font:italic 900 22px Georgia,serif;display:block;margin-top:2px}
.rodape{position:sticky;bottom:0;margin:26px calc(var(--g)*-1) 0;padding:22px var(--g) calc(16px + env(safe-area-inset-bottom,0px));z-index:4;background:linear-gradient(rgba(7,10,17,0),rgba(7,10,17,.94) 38%)}
.semtab .view{padding-bottom:0}
.envio{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:var(--cell)}
.envio .tx{flex:1;min-width:0}.envio b{display:block;font:500 16px var(--display)}.envio small{color:var(--sub);font-size:13px}

/* revisão */
.player{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:#000;margin-top:4px}
.player .capa{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.player .play{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(242,234,223,.16);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(242,234,223,.25)}
.player .leg{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(3,17,30,.85))}
.player .leg b{font:500 16px var(--display)}.player .leg span{font-size:12.5px;padding:4px 9px;border-radius:9px;background:rgba(3,17,30,.6)}
.player .estado{display:none}.player .capa.foto::after{background:linear-gradient(transparent 55%,rgba(3,6,11,.6))}.player .play,.player .leg{z-index:3}.player .cap-t{top:14%;font-size:9px}.player .cap-t i{font-size:30px}.player .cap-t span{font-size:12px}
.player.tocando{aspect-ratio:9/16}
.player video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.parecer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opc{display:flex;align-items:center;justify-content:center;gap:8px;height:60px;padding:0 10px;border-radius:20px;background:var(--cell);font:500 14.5px var(--display);white-space:nowrap;color:var(--sub);transition:box-shadow .2s,color .2s,background .2s}
.opc svg{width:20px;height:20px}
.opc.sel{color:var(--txt);background:var(--orange-soft);box-shadow:inset 0 0 0 1.5px var(--orange)}
.opc.ok.sel{background:rgba(60,203,134,.12);box-shadow:inset 0 0 0 1.5px var(--ok)}

<script>
/* ---------- dados: Supabase (RLS: só quem está na tabela equipe enxerga) ---------- */
const SUPA_URL=(window.BORA_SUPA||{}).url, SUPA_ANON=(window.BORA_SUPA||{}).anon;
const sb=supabase.createClient(SUPA_URL,SUPA_ANON);
const EDITOR=(window.BORA_SUPA||{}).editor||'';
const DB={global:null,clientes:[]};
const STP={editando:'run',revisao:'wait',aprovado:'ok'};
function falha(e){console.error(e);toast('Não salvou: '+(e.message||e));throw e}
async function q(p){const {data,error}=await p;if(error)falha(error);return data}
async function carregarTudo(){
 const [g,cs,dna,refs,projs,vers,sugs]=await Promise.all([
  q(sb.from('regras_globais').select('regras').eq('id',1).maybeSingle()),q(sb.from('clientes').select('*').order('criado_em')),
  q(sb.from('dna_ativo').select('*')),q(sb.from('referencias').select('*').order('criado_em')),
  q(sb.from('projetos').select('*').order('criado_em',{ascending:false})),q(sb.from('versoes').select('*').order('numero')),
  q(sb.from('sugestoes_dna').select('*').eq('status','pendente').order('criado_em'))]);
 DB.global=g?g.regras:null;
 DB.clientes=cs.map(c=>{const d=(dna.find(x=>x.cliente_id===c.id)||{}),w=c.nome.split(' ');
  const projetos=projs.filter(p=>p.cliente_id===c.id).map(p=>{const m=p.original_meta||{},vs=vers.filter(v=>v.projeto_id===p.id);
   return {id:p.id,cli:c.id,t:m.rotulo||'',tema:p.titulo,sub:m.pergunta||'',dur:m.dur||'—',st:STP[p.status],prog:null,c2:0,media:m,cores:p.cores_texto,
    versoes:vs.map(v=>({id:v.id,previa:v.previa_path,final:v.final_drive_id,n:v.numero,st:v.status,resumo:v.resumo,feedback:v.feedback,sugerir:v.sugerir_dna}))}});
  return {...(d.dna||{}),id:c.id,nome:c.nome,segmento:c.segmento,status:c.status,status_nota:c.status_nota,drive:c.drive_pasta_id,
   dna_versao_id:d.dna_versao_id,dna_numero:d.numero||0,regras_confirmadas:(d.dna||{}).regras_confirmadas||[],
   paleta:(d.dna||{}).paleta||{cores:[],origem:'pendente'},texto:(d.dna||{}).texto||{legenda:'#FFFFFF',destaque:null,origem:'pendente'},
   ini:(w.length>1?w[0][0]+w[w.length-1][0]:c.nome.slice(0,2)).toUpperCase(),cls:c.id==='fabiola'?'f':'',
   referencias:refs.filter(r=>r.cliente_id===c.id).map(r=>({...r,analise:r.analise==='analisado'?'analisado':'nao'})),
   projetos,sugestoes:sugs.filter(s=>s.cliente_id===c.id).map(s=>{const v=vers.find(x=>x.id===s.versao_id),p=v&&projs.find(x=>x.id===v.projeto_id);
    return {id:s.id,texto:s.texto,versao:v?v.numero:'?',projeto:p?p.titulo:''}})}});await atualizarCapas()}
/* miniaturas reais (quadro do vídeo) guardadas no Storage; links assinados renovados a cada ~50 min */
const CAPAS={};async function atualizarCapas(){const ag=Date.now(),faltam=[...new Set(DB.clientes.flatMap(c=>c.projetos.map(p=>(p.media||{}).capa).filter(Boolean)))].filter(k=>!CAPAS[k]||ag-CAPAS[k].t>3e6);
 if(!faltam.length)return;try{const {data}=await sb.storage.from('previas').createSignedUrls(faltam,3600);(data||[]).forEach(x=>{if(x.signedUrl)CAPAS[x.path]={u:x.signedUrl,t:ag}})}catch(e){}}
const fotoDe=v=>{const k=(v.media||{}).capa;return k&&CAPAS[k]?CAPAS[k].u:null};
const carregarPerfil=id=>cli(id);
async function recarregar(){await carregarTudo();render()}
const ST={ok:['Aprovado','ok'],wait:['Para revisar','wait'],run:['Em produção','run']};
const S={anexos:{},ajTxt:'',cores:null,arquivos:[],stack:[{v:'inicio'}],tab:'inicio',sugerir:true,novaCli:null,parecer:{},briefing:'',coresAbertas:false};
const $=s=>document.querySelector(s), cli=id=>DB.clientes.find(c=>c.id===id);
const todos=()=>DB.clientes.flatMap(c=>c.projetos.map(p=>(p.cli=c.id,p)));
const vid=id=>todos().find(v=>v.id===id), vatual=v=>v.versoes[v.versoes.length-1]||{};
const SV=(d,cl='ico')=>`<svg class="${cl}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I={
 voltar:'<path d="M15 5l-7 7 7 7"/>',sino:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/>',
 seta:'<path d="M5 12h14M13 6l6 6-6 6"/>',mais:'<path d="M12 5v14M5 12h14"/>',casa:'<path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-5.5h-5V20.5H5a1 1 0 0 1-1-1z"/>',
 pessoas:'<circle cx="9" cy="8.5" r="3.3"/><path d="M3 19.5c.8-3.3 3.2-5 6-5s5.2 1.7 6 5"/><path d="M15.5 5.3a3.3 3.3 0 0 1 0 6.4M17.6 14.8c1.8.7 3 2.2 3.4 4.7"/>',
 revisar:'<rect x="6.5" y="3" width="11" height="18" rx="3"/><path d="M10.8 9.6l3.6 2.4-3.6 2.4z"/>',ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
 nuvem:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4.5 4.5 0 0 1-.5 9"/><path d="M12 12v8M9 15l3-3 3 3"/>',pasta:'<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
 ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.7"/>',refaz:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
 clipe:'<path d="M20.5 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>',
 baixar:'<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',play:'<path d="M8 5.5l11 6.5-11 6.5z" fill="#fff" stroke="none"/>',dna:'<path d="M7 3c0 6 10 6 10 12s-10 0-10 6M17 3c0 6-10 6-10 12M9 6h6M9 18h6"/>',
 doc:'<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4M9 12h6M9 15.5h6"/>',historico:'<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4h4"/><path d="M12 8v4.5l3 2"/>'};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const prov=c=>c.status!=='base_confirmada';
const ORIGEM={observada_em_aprovados:'observada nos aprovados',observada_validar:'observada, a validar',pendente:'pendente: aguardando arquivos oficiais',aprovado:'aprovado'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
const emProducao=()=>todos().filter(v=>v.st==='run'||(v.st==='ok'&&!vatual(v).final&&!(v.media||{}).final_pronto));
const paraRevisar=()=>todos().filter(v=>v.st==='wait');
const falta=v=>{const s=(v.media||{}).previsao_s;if(typeof s!=='number'||s<0)return '';const m=Math.round(s/60);return m<1?'falta menos de 1 min':'faltam cerca de '+m+' min'};
const detalhe=v=>[(v.media||{}).detalhe,falta(v)].filter(Boolean).join(' · ');
const pct=v=>{const p=(v.media||{}).progresso;return typeof p==='number'?Math.max(0,Math.min(100,Math.round(p))):null};

/* anel da Bora: as órbitas do símbolo giram enquanto o vídeo é produzido, o arco laranja é o progresso */
function arco(r,a1,a2){const p=a=>[50+r*Math.cos(a*Math.PI/180),50+r*Math.sin(a*Math.PI/180)],[x1,y1]=p(a1),[x2,y2]=p(a2);return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`}
function anel(p,tam=64,txt=true){const C=2*Math.PI*30,off=p==null?C*.78:C*(1-p/100);
 return `<span class="bring" style="width:${tam}px;height:${tam}px" role="img" aria-label="${p==null?'Na fila':p+'% pronto'}"><svg viewBox="0 0 100 100">
  <g class="orb" fill="none" stroke="#FF5E16" stroke-width="3.2" stroke-linecap="round" opacity=".9"><path d="${arco(44,200,300)}"/><path d="${arco(44,20,120)}"/></g>
  <g class="orb2" fill="none" stroke="#F2EADF" stroke-width="2.4" stroke-linecap="round" opacity=".35"><path d="${arco(38,240,330)}"/><path d="${arco(38,60,150)}"/></g>
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(242,234,223,.12)" stroke-width="5"/>
  <circle class="pg" cx="50" cy="50" r="30" fill="none" stroke="#FF5E16" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 50 50)"/>
 </svg>${txt?`<b style="font-size:${Math.round(tam/4.4)}px">${p==null?'':p+'%'}</b>`:''}</span>`}

function capa(v){const f=fotoDe(v);return `<div class="capa ${v.c2?'c2':''} ${f?'foto':''}">${f?`<img src="${f}" alt="" loading="lazy" decoding="async">`:''}<span class="estado ${ST[v.st][1]}">${v.st==='ok'&&!vatual(v).final&&!(v.media||{}).final_pronto?'Gerando 4K':ST[v.st][0]}</span>
 <div class="cap-t">${esc(v.t)}<i>${esc(v.tema)}</i><span>${esc(v.sub)}</span></div>${v.st==='run'||(v.st==='ok'&&!vatual(v).final&&!(v.media||{}).final_pronto&&(v.media||{}).andamento)?`<div class="anel">${anel(pct(v),58)}</div>`:''}</div>`}
const legenda=v=>v.st==='run'?fase(v):(cli(v.cli).nome+' · v'+vatual(v).n);
function vcard(v){return `<button class="vcard" data-push="video:${v.id}">${capa(v)}<h4>${esc(v.tema)}</h4><small>${esc(legenda(v))}</small></button>`}
function cliLinha(c){const n=c.projetos.filter(v=>v.st==='wait').length;
 return `<button class="cli" data-push="cliente:${c.id}" aria-label="${esc(c.nome)}, ${esc(c.segmento)}, DNA ${prov(c)?'provisório':'confirmado'}"><span class="ini ${c.cls}">${c.ini}<i class="dt ${prov(c)?'pv':''}" title="DNA ${prov(c)?'provisório':'confirmado'}"></i></span><span class="tx"><b>${esc(c.nome)}</b>
  <small>${esc(c.segmento)}</small></span>${n?`<span class="qtd">${n}</span>`:'<span class="seta">›</span>'}</button>`}
function ln(v){return `<button class="ln" data-push="video:${v.id}"><span class="mini-capa">${capa(v)}</span><span class="tx"><b>${esc(v.tema)}${v.sub?': '+esc(v.sub):''}</b><small>${esc(cli(v.cli).nome)} · ${v.st==='run'?esc(fase(v))+(pct(v)!=null?' · '+pct(v)+'%':''):ST[v.st][0]+' · v'+vatual(v).n}</small></span><span class="seta">›</span></button>`}
const par=(a,b)=>`<div class="ln"><span class="tx"><small style="margin:0">${a}</small><b style="font-weight:400;font-size:14.5px">${esc(b)}</b></span></div>`;
const linhas=(arr,cor)=>arr.map(x=>`<div class="ln"><span class="tx"><b style="font-weight:400;font-size:14.5px${cor?';color:'+cor:''}">${esc(x)}</b></span></div>`).join('');
const LISTAS=[['ganchos','Ganchos'],['edicao','Edição'],['legendas_identidade','Legendas e identidade'],['evitar','Evitar']];

const V={
 login(){return `<div class="login">${marca}<h1 class="titulo" style="margin-top:34px">Entrar no <em>Studio</em></h1><p class="apoio">Acesso da equipe Bora</p>

 else if(d.tentar){(async()=>{try{const {data}=await sb.from('projetos').select('original_meta').eq('id',d.tentar).single();
   const m={...(data.original_meta||{}),andamento:'Na fila do editor',progresso:null,andamento_versao:null,falha_memoria:null};
   await q(sb.from('projetos').update({original_meta:m}).eq('id',d.tentar));await recarregar();toast('Pedido de novo pro editor')}catch(e){toast('Não consegui: '+e.message)}})()}
 else if('drive' in d)abrirDrive(null)
 else if(d.dpasta){const[id,nome]=d.dpasta.split('|');abrirDrive(id,nome)}
 else if('dvolta' in d){S.dnav.trilha.pop();const t=S.dnav.trilha.pop();abrirDrive(t.id||null,t.nome);if(!t.id)S.dnav.trilha=[{id:'',nome:'Google Drive'}]}
 else if(d.dvid){const D=S.dnav;D.sel[d.dvid]?delete D.sel[d.dvid]:(D.sel[d.dvid]=1);sheet(sheetDrive())}
 else if('dusar' in d){const D=S.dnav,t=D.trilha[D.trilha.length-1];S.drive={nome:t.nome,arquivos:D.r.videos.filter(v=>D.sel[v.id]).map(v=>({id:v.id,nome:v.nome,tamanho:v.tamanho}))};
  S.arquivos.forEach(x=>URL.revokeObjectURL(x._url));S.arquivos=[];S.briefing=($('#briefing')||{}).value||S.briefing;close();reRender()}
 else if(d.dpapel!==undefined&&S.drive){const f=S.drive.arquivos[+d.dpapel],ord=['','fala','ambiente'];f.papel=ord[(ord.indexOf(f.papel||'')+1)%3];S.briefing=($('#briefing')||{}).value||S.briefing;reRender()}
 else if('semdrive' in d){S.drive=null;S.briefing=($('#briefing')||{}).value||S.briefing;reRender()}
 else if('pushAtivar' in d)ativarPush();
 else if(d.suggl)decidirGlobal(d.suggl);
 else if(d.sugok)decidir(d.sugok,true);else if(d.sugno)decidir(d.sugno,false);
 else if(d.toast)toast(d.toast)});
async function enviarOriginal(pid,f,n,prog,tipo){const qt=tipo?'&tipo='+tipo:'';const PED=8<<20,tok=async()=>(await sb.auth.getSession()).data.session.access_token;
 let off=(await (await fetch(`${EDITOR}/upload/${pid}/${n}?x=1${qt}`,{headers:{Authorization:'Bearer '+await tok()}})).json()).recebido||0;
 while(off<f.size){let ok=false;for(let t=0;t<5&&!ok;t++){try{const r=await fetch(`${EDITOR}/upload/${pid}/${n}?offset=${off}${qt}`,{method:'PUT',headers:{Authorization:'Bearer '+await tok()},body:f.slice(off,off+PED)});
   const j=await r.json();if(r.ok||r.status===409){off=j.recebido;ok=true}else throw new Error(j.erro)}catch(e){await new Promise(z=>setTimeout(z,1500*(t+1)))}}
  if(!ok)throw new Error('sem conexão com o editor');prog(off)}}
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='anx'&&t.files.length){const id=t.dataset.proj;S.ajTxt=($('#aj')||{}).value||'';(S.anexos[id]=S.anexos[id]||[]).push(...t.files);t.value='';reRender();return}
 if(t.id==='arq'&&t.files.length){S.briefing=($('#briefing')||{}).value||S.briefing;[...t.files].forEach(f=>{f._url=URL.createObjectURL(f);S.arquivos.push(f)});t.value='';reRender()}
 else if(t.id==='selcli'){S.novaCli=t.value;S.cores=null;S.briefing=($('#briefing')||{}).value||S.briefing;reRender()}
 else if(t.dataset.cc){S.cores[t.dataset.cc]=t.value;reRender()}});
setInterval(()=>{if(document.hidden||!DB.clientes.length)return;
 if($('#sheet.on [data-stgo]')){carregarTudo().then(()=>{$('#sheet').innerHTML=sheetStatus()}).catch(()=>{});return}
 const nm=S.stack[S.stack.length-1].v.split(':')[0];if($('#sheet').classList.contains('on')||['login','nova'].includes(nm)||$('#vid video')||$('#aj'))return;
 carregarTudo().then(reRender).catch(()=>{})},20000);
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s+'='.repeat((4-s.length%4)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function ativarPush(){try{
 if(!('serviceWorker' in navigator)||!('PushManager' in window))return toast('No iPhone, abra o Bora Studio pelo ícone da Tela de Início');
 const perm=await Notification.requestPermission();if(perm!=='granted')return toast('Notificações não permitidas. Libere em Ajustes do iPhone > Notificações');
 const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
 const {chave}=await (await fetch(`${EDITOR}/push/chave`)).json();
 const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(chave)});
 const tok=(await sb.auth.getSession()).data.session.access_token;
 const r=await fetch(`${EDITOR}/push/inscrever`,{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(sub)});
 if(!r.ok)throw new Error('servidor recusou');S.pushOk=true;reRender();toast('Notificações ativadas')}catch(e){toast('Não ativou: '+e.message)}}
async function iniciar(){S.stack=[{v:'carregando'}];render();try{await carregarTudo();S.stack=[{v:S.tab||'inicio'}];const hv=(location.hash.match(/v=([\w-]+)/)||[])[1];if(hv&&vid(hv))S.stack.push({v:'video:'+hv});render()
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg&&await reg.pushManager.getSubscription()&&Notification.permission==='granted')S.pushOk=true}catch(_){}}catch(e){S.stack=[{v:'erro'}];render()}}
sb.auth.getSession().then(({data})=>{if(data.session)iniciar();else{S.stack=[{v:'login'}];render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#flogin')){e.preventDefault();document.querySelector('[data-entrar]').click()}});
